<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JS Practice</title>
</head>
<body>

    <h1>JavaScript Practice: Variables, Conditions, and Functions</h1>
    
    <p>Please enter your name and age below:</p>

    <div>
        <label for="nameInput">Name: </label>
        <input type="text" id="nameInput" placeholder="Enter your name">
    </div>
    <br>
    <div>
        <label for="ageInput">Age: </label>
        <input type="number" id="ageInput" placeholder="Enter your age">
    </div>
    <br>

    <button onclick="handleUserSubmission()">Submit</button>

    <br><br>

    <div id="resultContainer"></div>

    <script>
        function generateGreeting(name) {
            return "Hello, " + name + "! Welcome to our page.";
        }

        function handleUserSubmission() {
            let name = document.getElementById("nameInput").value.trim();
            let ageInput = document.getElementById("ageInput").value.trim();
            let resultDiv = document.getElementById("resultContainer");

            if (name === "" || ageInput === "") {
                resultDiv.innerHTML = "<p>Please fill in both name and age fields.</p>";
                return;
            }

            let age = Number(ageInput);

            if (isNaN(age) || age < 0) {
                resultDiv.innerHTML = "<p>Please enter a valid numeric age.</p>";
                return;
            }

            let greetingMessage = generateGreeting(name);

            let statusMessage = "";
            if (age < 18) {
                statusMessage = "You are a minor.";
            } else {
                statusMessage = "You are an adult.";
            }

            resultDiv.innerHTML = `
                <h2>Results:</h2>
                <p><strong>Greeting:</strong> ${greetingMessage}</p>
                <p><strong>Name entered:</strong> ${name}</p>
                <p><strong>Age entered:</strong> ${age}</p>
                <p><strong>Status:</strong> ${statusMessage}</p>
            `;
        }
    </script>

</body>
</html>
